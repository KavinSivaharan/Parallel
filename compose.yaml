services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parallel
      POSTGRES_USER: parallel
      POSTGRES_PASSWORD: parallel
    ports:
      - "5432:5432"
    volumes:
      - parallel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallel"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - parallel-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  parallel-postgres:
  parallel-redis:

